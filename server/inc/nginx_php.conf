server {
    listen 80;

    server_name .{{ dominio }};
    
    root /home/{{ conta }}/public_html/;
    index index.html index.htm index.php;

    client_max_body_size 50M;

    access_log /home/{{ conta }}/logs/access.log;
    error_log /home/{{ conta }}/logs/error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # bloqueia acesso a arquivos ocultos (.env, .git, .htaccess...)
    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:{{ php_fpm_sock }};
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # mitigação da vulnerabilidade "httpoxy" (CVE-2016-5385 e relacionadas):
        # impede que o header HTTP "Proxy" do cliente vaze para a var de
        # ambiente HTTP_PROXY usada por libs PHP
        fastcgi_param HTTP_PROXY "";
        include fastcgi_params;
    }
}