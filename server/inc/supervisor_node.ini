[program:{{ conta }}]
command={{ npm_start_cmd|default('npm run start') }}
directory=/home/{{ conta }}/project
user={{ conta }}
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=false
stdout_logfile=/home/{{ conta }}/logs/node.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/home/{{ conta }}/logs/{{ conta }}_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PORT="{{ porta }}",NODE_ENV="production",PATH="/usr/local/bin:/usr/bin:/bin",LANG="pt_BR.UTF-8",LC_ALL="pt_BR.UTF-8"
