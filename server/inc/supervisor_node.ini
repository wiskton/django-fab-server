[program:{{ conta }}]
command={{ npm_start_cmd|default('npm run start') }}
directory=/home/{{ conta }}/project
user={{ conta }}
autostart=true
autorestart=true
redirect_stderr=false
environment=PORT="{{ porta }}",NODE_ENV="production",PATH="/usr/local/bin:/usr/bin:/bin",LANG="pt_BR.UTF-8",LC_ALL="pt_BR.UTF-8"
stderr_logfile=/home/{{ conta }}/logs/{{ conta }}_error.log
