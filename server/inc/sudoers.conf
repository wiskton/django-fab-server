# /etc/sudoers.d/{{ conta }}
# Regra de privilégios mínimos para isolamento do projeto {{ conta }}.
# Permite que o usuário do projeto reinicie, pare, inicie e consulte
# SOMENTE os seus próprios processos via supervisorctl-restricted,
# sem permissões gerais de sudo supervisorctl e sem expor outros projetos.
{{ conta }} ALL=(root) NOPASSWD: /usr/local/bin/supervisorctl-restricted {{ conta }} *, /usr/local/bin/supervisorctl-restricted {{ conta }}, /usr/local/bin/supervisorctl-restricted
