# /etc/vsftpd.conf -- config básica equivalente ao proftpd.conf usado nas
# outras distros (usuários locais, sem acesso anônimo, cada um preso na sua
# própria home). Usado apenas quando os_family == "arch" (proftpd não tem
# pacote oficial no Arch).

listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES

# prende cada usuário na própria home (equivalente ao "DefaultRoot ~" do proftpd)
chroot_local_user=YES
allow_writeable_chroot=YES

# usuários precisam de um shell válido em /etc/shells para logar
# (equivalente a não usar "RequireValidShell off" do proftpd)
local_umask=022

dirmessage_enable=YES
use_localtime=YES

xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=YES

connect_from_port_20=YES

# porta padrão do FTP
listen_port=21

# faixa de portas passivas -- ajuste conforme o firewall do servidor
pasv_min_port=49152
pasv_max_port=65534

# esconde a versão do vsftpd no banner
ftpd_banner=FTP
