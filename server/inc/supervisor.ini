[program:{{ conta }}]
command=/home/{{ conta }}/env/bin/gunicorn --chdir /home/{{ conta }}/project --pythonpath /home/{{ conta }}/project -b 127.0.0.1:{{ porta }} --workers {{ gunicorn_workers|default(3) }} --timeout {{ gunicorn_timeout|default(120) }} --keep-alive 5 {{ pasta_settings }}.wsgi:application
directory=/home/{{ conta }}/project
user={{ conta }}
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=10
stopsignal=QUIT
stopasgroup=true
killasgroup=true
redirect_stderr=false
stdout_logfile=/home/{{ conta }}/logs/gunicorn.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/home/{{ conta }}/logs/{{ conta }}_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONPATH="/home/{{ conta }}/project",LANG="pt_BR.UTF-8",LC_ALL="pt_BR.UTF-8"

{% if with_celery %}
[program:{{ conta }}_celery_worker]
command=/home/{{ conta }}/env/bin/celery -A {{ pasta_settings }} worker -l info
directory=/home/{{ conta }}/project
user={{ conta }}
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=false
stdout_logfile=/home/{{ conta }}/logs/celery_worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/home/{{ conta }}/logs/celery_worker_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONPATH="/home/{{ conta }}/project",LANG="pt_BR.UTF-8",LC_ALL="pt_BR.UTF-8"

[program:{{ conta }}_celery_beat]
command=/home/{{ conta }}/env/bin/celery -A {{ pasta_settings }} beat -l info --schedule=/home/{{ conta }}/logs/celerybeat-schedule.db --pidfile=/home/{{ conta }}/logs/celerybeat.pid
directory=/home/{{ conta }}/project
user={{ conta }}
autostart=true
autorestart=true
startsecs=3
startretries=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=false
stdout_logfile=/home/{{ conta }}/logs/celery_beat.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/home/{{ conta }}/logs/celery_beat_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONPATH="/home/{{ conta }}/project",LANG="pt_BR.UTF-8",LC_ALL="pt_BR.UTF-8"

[group:{{ conta }}]
programs={{ conta }},{{ conta }}_celery_worker,{{ conta }}_celery_beat
{% endif %}