[program:{{ conta }}]
command=/home/{{ conta }}/env/bin/gunicorn --chdir /home/{{ conta }}/project --pythonpath /home/{{ conta }}/project -b 127.0.0.1:{{ porta }} {{ pasta_settings }}.wsgi:application
directory=/home/{{ conta }}/project
user={{ conta }}
autostart=true
autorestart=true
redirect_stderr=true
environment=PYTHONPATH="/home/{{ conta }}/project",LANG="pt_BR.UTF-8",LC_ALL="pt_BR.UTF-8"
