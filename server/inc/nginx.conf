upstream {{ conta }} {
    server 127.0.0.1:{{ porta }};
}

server {
    listen 80;
    server_name {{ dominio }} www.{{ dominio }} static.{{ dominio }} media.{{ dominio }};
    client_max_body_size 50M;

    access_log /home/{{ conta }}/logs/access.log;
    error_log /home/{{ conta }}/logs/error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Arquivos estaticos coletados (compativel com staticfiles e static)
    location /static/ {
        alias /home/{{ conta }}/project/staticfiles/;
        try_files $uri $uri/ @fallback_static;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location @fallback_static {
        alias /home/{{ conta }}/project/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Arquivos de media (uploads)
    location /media/ {
        alias /home/{{ conta }}/project/media/;
        expires 7d;
        access_log off;
    }

    # Bloqueia acesso a arquivos ocultos (.env, .git, .htaccess...)
    location ~ /\. {
        deny all;
    }

    # Proxy reverso para aplicacao Python / Gunicorn
    location / {
        proxy_pass http://{{ conta }};
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}