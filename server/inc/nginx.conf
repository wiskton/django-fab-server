upstream {{ conta }} {
    server 127.0.0.1:{{ porta }};
}

server {
    listen 80;
    server_name static.{{ dominio }};
    client_max_body_size 50M;

    location / {
        alias /home/{{ conta }}/project/static/;
        add_header Access-Control-Allow-Origin *;
        autoindex off;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    server_name media.{{ dominio }};
    client_max_body_size 50M;

    location / {
        alias /home/{{ conta }}/project/media/;
        add_header Access-Control-Allow-Origin *;
        autoindex off;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    server_name {{ dominio }} www.{{ dominio }};
    client_max_body_size 50M;

    access_log /home/{{ conta }}/logs/access.log;
    error_log /home/{{ conta }}/logs/error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Bloqueia acesso a arquivos ocultos (.env, .git, .htaccess...)
    location ~ /\. {
        deny all;
    }

    # Proxy reverso para aplicacao Python / Gunicorn
    location / {
        proxy_pass http://{{ conta }};
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}