; supervisor config file
; Configuração global do Supervisor com isolamento seguro

[unix_http_server]
file=/var/run/supervisor.sock   ; (caminho seguro do socket unix)
chmod=0700                      ; restrito a root (evita acesso irrestrito ao socket global)
chown=root:root

[supervisord]
logfile=/var/log/supervisor/supervisord.log ; (arquivo de log principal)
pidfile=/var/run/supervisord.pid            ; (pidfile do supervisord)
childlogdir=/var/log/supervisor             ; (diretório padrão de logs de filhos)

; RPC interface necessária para o supervisorctl
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; Inclui configurações centralizadas em conf.d e supervisor.ini dos usuários
; Preserva compatibilidade total com os projetos existentes no servidor
[include]
files = /etc/supervisor/conf.d/*.conf /etc/supervisord.d/*.conf /home/*/supervisor.ini
